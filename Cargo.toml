[package]
name = "cv-writer"
version = "0.2.0"
edition = "2024"
authors = ["ahndunn@gmail.com"]
description = "Agent-first stateless CLI tool for synthesizing, diffing, and compiling CVs into PDF using LuaLaTeX"
repository = "git@github.com:ahndunn/cv-writer.git"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "cargo"] }
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = { version = "2.7", features = ["serde"] }
tempfile = "3.17"
tera = "1.20"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
which = "7.0"

[dev-dependencies]
tokio-test = "0.4"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
