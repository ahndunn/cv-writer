[package]
name = "cv-writer-mcp"
version = "0.1.1"
edition = "2024"
authors = ["ahndunn@gmail.com"]
description = "Stateless MCP server for synthesizing and compiling CVs into PDF using LuaLaTeX"
repository = "git@github.com:ahndunn/cv-writer.git"

[dependencies]
base64 = "0.22"
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.17"
tera = "1.20"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
which = "7.0"

[dev-dependencies]
tokio-test = "0.4"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
